name: Build and Release

on:
  push:
    branches: [ main, v0.8-tabbed-workflows ]
    paths:
      - "KRWardrobeCleaner/**"
      - "repo.json"
      - ".github/workflows/build-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud dev files
        shell: pwsh
        run: |
          $dest = Join-Path $env:APPDATA "XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          Invoke-WebRequest -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" -OutFile "latest.zip"
          Expand-Archive -Force "latest.zip" $dest

      - name: Build
        shell: pwsh
        run: dotnet build ".\KRWardrobeCleaner\KRWardrobeCleaner.csproj" --configuration Release

      - name: Resolve package output
        id: package
        shell: pwsh
        run: |
          $project = [xml](Get-Content ".\KRWardrobeCleaner\KRWardrobeCleaner.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT

          $root = ".\KRWardrobeCleaner\bin\Release"
          $dll = Get-ChildItem $root -Recurse -File -Filter "KRWardrobeCleaner.dll" | Select-Object -First 1
          $manifest = Get-ChildItem $root -Recurse -File -Filter "KRWardrobeCleaner.json" | Select-Object -First 1

          if ($null -eq $dll) {
            Get-ChildItem ".\KRWardrobeCleaner\bin" -Recurse | Select-Object FullName
            throw "KRWardrobeCleaner.dll not found after successful build."
          }
          if ($null -eq $manifest) {
            Get-ChildItem ".\KRWardrobeCleaner\bin" -Recurse | Select-Object FullName
            throw "KRWardrobeCleaner.json not found after successful build."
          }

          New-Item -ItemType Directory -Force -Path ".\package" | Out-Null
          Copy-Item $dll.FullName ".\package\KRWardrobeCleaner.dll" -Force
          Copy-Item $manifest.FullName ".\package\KRWardrobeCleaner.json" -Force
          Compress-Archive -Path ".\package\*" -DestinationPath ".\KRWardrobeCleaner.zip" -Force

          $dllHash = (Get-FileHash ".\package\KRWardrobeCleaner.dll" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash ".\KRWardrobeCleaner.zip" -Algorithm SHA256).Hash
          Set-Content ".\SHA256SUMS.txt" "KRWardrobeCleaner.dll  $dllHash`nKRWardrobeCleaner.zip  $zipHash"
          Copy-Item ".\package\KRWardrobeCleaner.dll" ".\KRWardrobeCleaner.dll" -Force
          "dll_sha256=$dllHash" >> $env:GITHUB_OUTPUT
          "zip_sha256=$zipHash" >> $env:GITHUB_OUTPUT

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: KRWardrobeCleaner-${{ steps.package.outputs.version }}
          path: |
            KRWardrobeCleaner.dll
            KRWardrobeCleaner.zip
            SHA256SUMS.txt
            repo.json
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.package.outputs.tag }}
          VERSION: ${{ steps.package.outputs.version }}
        shell: pwsh
        run: |
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG ".\KRWardrobeCleaner.zip#Dalamud install package" ".\KRWardrobeCleaner.dll#Raw DLL" ".\SHA256SUMS.txt#SHA-256 checksums" --title "히메짱 옷장 정리기 $env:VERSION" --notes "v0.8은 UI를 4개 단계별 탭으로 재구성하고, 환상의 옷장→인벤토리 복원, 장비함+인벤토리→환상의 옷장 저장, 스마트 장비함 이동, 자동 파기 기능만 남긴 정리 버전입니다. 마테리아와 투영 상태는 후보 필터에서 제외하지 않습니다."
          } else {
            gh release upload $env:TAG ".\KRWardrobeCleaner.zip#Dalamud install package" ".\KRWardrobeCleaner.dll#Raw DLL" ".\SHA256SUMS.txt#SHA-256 checksums" --clobber
          }

      - name: Build summary
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_STEP_SUMMARY "## 히메짱 옷장 정리기 ${{ steps.package.outputs.version }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- DLL SHA-256: ${{ steps.package.outputs.dll_sha256 }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- ZIP SHA-256: ${{ steps.package.outputs.zip_sha256 }}"
          Add-Content $env:GITHUB_STEP_SUMMARY "- Custom repo: https://raw.githubusercontent.com/yaaung-ai/KRWardrobeCleaner/main/repo.json"

